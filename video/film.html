<!DOCTYPE html>

<style>

<body>
<div id="quadro">
  <div id="marca-mini" class="abs"><img src="assets/logo_klareza_beauty_original.svg" alt=""><span class="wordmark" style="font-size:30px">Klareza<b>Beauty</b></span></div>

<script>
(() => {
const C = window.CENAS, $ = (s) => document.querySelector(s);
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
// ---------- utilidades (funções puras do tempo) ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut = (x) => 1 - Math.pow(1 - clamp(x), 5);
const eInOut = (x) => { x = clamp(x); return x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; };
const mola = (x) => { x = clamp(x); return 1 - Math.exp(-6 * x) * Math.cos(12 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, d) => clamp((t - t0) / d);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const marcar = (s) => s.replace(/\{(.+?)\}/g, '<span class="k">$1</span>');
const PW = 936, PH = 760;

// ---------- construção do DOM (uma vez) ----------
const palco = $('#palco');
const imgs = [];
C.S.forEach((s, i) => {
  const el = document.createElement('div'); el.className = 'tomada'; el.style.display = 'none';
  if (s.tipo === 'desk') {
    el.innerHTML = `<div class="tela"><img src="${s.img}"><span class="etiqueta${s.etqBaixo ? ' baixo' : ''}">${s.etiqueta || 'Exemplo · dados fictícios'}</span></div>`;
  } else if (s.tipo === 'cel') {
    el.innerHTML = `<div class="cel"><div class="vidro"><img src="${s.img}"></div><span class="etiqueta">Exemplo · dados fictícios</span></div>`;
  } else if (s.tipo === 'html' && s.html === 'whats') {
    el.innerHTML = `<div id="whats"><div class="rot">Exemplo · ilustração do envio</div>
      <div class="quem">Helena Dias · amanhã, 09:30<small>Pedicure com Diana Souza</small></div>
      <div class="msg"></div><div class="nota">O sistema prepara a mensagem. Quem envia é você, pelo seu WhatsApp.</div>
      <div class="feito"></div><div class="enviar">Enviar ➤</div></div>`;
  }
  (s.hl || []).forEach(() => { const a = document.createElement('div'); a.className = 'anel'; el.appendChild(a); });
  (s.taps || []).forEach(() => { const a = document.createElement('div'); a.className = 'toque'; a.innerHTML = '<u></u><i></i>'; el.appendChild(a); });
  if (s.tipo === 'html') { const a = document.createElement('div'); a.className = 'toque'; a.innerHTML = '<u></u><i></i>'; el.appendChild(a); }
  palco.appendChild(el); s.el = el; s.i = i;
  const im = el.querySelector('img'); if (im) imgs.push(im);
});
const MSG = 'Oi, Helena! Passando para lembrar do seu horário no Studio Flor de Lótus amanhã às 09:30 ✨\nPedicure com Diana Souza\nConfirme sua presença aqui: (link)\nTe esperamos!';
// títulos
const titulo = $('#titulo');
C.CAP.forEach((c) => { const d = document.createElement('div'); d.style.position = 'absolute'; d.style.left = '0'; d.style.top = '0';
  d.innerHTML = c.titulo.map(l => `<div class="linha"><span class="in">${marcar(l)}</span></div>`).join(''); titulo.appendChild(d); c.el = d; });
// gancho
const gancho = $('#gancho');
C.GANCHO.forEach(([t, txt], i) => { const d = document.createElement('div'); d.className = 'linha'; d.innerHTML = `<span class="in">${marcar(txt)}</span>`; gancho.appendChild(d); });
const riscos = [0, 1].map(() => { const r = document.createElement('div'); r.className = 'risco'; gancho.appendChild(r); return r; });
// subtítulos
const subs = [];
C.S.forEach((s) => { if (s.sub) { const d = document.createElement('div'); d.textContent = s.sub; $('#sub').appendChild(d); subs.push({ t: s.subT, el: d }); } });
const PLANO_SUB = [
  [C.W(8, 'Solo'), 'Solo: R$ 59,90/mês ou R$ 599/ano · 1 profissional, 1 unidade.'],
  [C.W(8, 'Bairro'), 'Bairro: R$ 149,90/mês ou R$ 1.499/ano · equipe ilimitada, 1 unidade.'],
  [C.W(8, 'com'), 'Cidade: R$ 299,90/mês, até 2 unidades · Nacional: R$ 524,90/mês, ilimitadas.'],
  [C.W(8, 'a'), 'Todas as funções a partir do Bairro: R$ 149,90/mês, 1 unidade.'],
];
PLANO_SUB.forEach(([t, txt]) => { const d = document.createElement('div'); d.textContent = txt; $('#sub').appendChild(d); subs.push({ t, el: d }); });
subs.sort((a, b) => a.t - b.t);
// régua
const chipsEl = $('#chips');
C.FUNCOES.forEach((f) => { const d = document.createElement('div'); d.className = 'chip'; d.textContent = f.txt; chipsEl.appendChild(d); f.el = d; });
$('#condicao').innerHTML = 'Clube no cartão e sinal por Pix: conta de recebimento aprovada (Asaas) e taxas. Placa com QR code: brinde do Bairro para cima, após a 1ª mensalidade paga.';
const grao = $('#grao'), g = grao.getContext('2d'), gdata = g.createImageData(270, 480);

// ---------- câmera ----------
function camDesk(s, t) {
  const k = s.cam;
  let atual = k[0][1];
  for (let j = 1; j < k.length; j++) { const p = eInOut(prog(t, k[j][0], 0.9)); atual = atual.map((v, n) => lerp(v, k[j][1][n], p)); }
  return atual;
}
function transfDesk(s, t, im) {
  const [x, y, w, h] = camDesk(s, t);
  const drift = 1 + 0.025 * clamp((t - s.t) / 6);
  const sc = Math.min(PW / w, PH / h) * drift;
  const iw = im.naturalWidth / s.u * sc, ih = im.naturalHeight / s.u * sc;
  let tx = PW / 2 - (x + w / 2) * sc, ty = PH / 2 - (y + h / 2) * sc;
  tx = iw >= PW ? clamp(tx, PW - iw, 0) : (PW - iw) / 2;
  ty = ih >= PH ? clamp(ty, PH - ih, 0) : (PH - ih) / 2;
  return { sc, tx, ty, iw, ih, map: (px, py) => [tx + px * sc, ty + py * sc] };
}
const CEL_W = 560, CEL_H = 740, CEL_X = 178 + 10, CEL_Y = 10;
function transfCel(s, t, im) {
  const sc = CEL_W / (im.naturalWidth / s.u);
  let y = s.cam[0][1];
  for (let j = 1; j < s.cam.length; j++) y = lerp(y, s.cam[j][1], eInOut(prog(t, s.cam[j][0], 1.0)));
  const maxY = im.naturalHeight / s.u - CEL_H / sc; y = clamp(y, 0, Math.max(0, maxY));
  return { sc, tx: 0, ty: -y * sc, map: (px, py) => [CEL_X + px * sc, CEL_Y + (py - y) * sc] };
}

// ---------- seek ----------
let ultimoT = 0;
function seek(t) {
  ultimoT = t;
  const fr = Math.round(t * 30);
  // gancho
  const fimG = C.CAP[0].t;
  gancho.style.display = t < fimG + 0.6 ? 'block' : 'none';
  [...gancho.querySelectorAll('.linha')].forEach((l, i) => {
    const t0 = C.GANCHO[i][0] - (i === 0 ? 0.3 : 0.08);
    const p = eOut(prog(t, t0, 0.5)), sai = eInOut(prog(t, fimG - 0.1 + i * 0.05, 0.5));
    l.firstChild.style.transform = `translateY(${(1 - p) * 110 - sai * 110}%)`;
  });
  // riscos sobre "caderno" e "planilha"
  riscos.forEach((r, i) => {
    const ln = gancho.querySelectorAll('.linha')[i]; const w = ln.firstChild.offsetWidth;
    r.style.left = '0px'; r.style.top = (i * 118 + 64) + 'px'; r.style.width = (w - 20) + 'px';
    const p = eOut(prog(t, C.GANCHO[2][0] + 0.2 + i * 0.15, 0.45)), sai = prog(t, fimG - 0.1, 0.3);
    r.style.transform = `scaleX(${p})`; r.style.opacity = 1 - sai;
  });
  // cabeçalho
  const cab = t >= fimG - 0.1;
  $('#marca-mini').style.opacity = eOut(prog(t, fimG, 0.6));
  // capítulo atual
  let ci = -1; C.CAP.forEach((c, i) => { if (t >= c.t) ci = i; });
  const marc = $('#marcador');
  if (ci >= 0) {
    const c = C.CAP[ci];
    marc.textContent = c.marcador;
    const pm = eOut(prog(t, c.t, 0.5)); marc.style.clipPath = `inset(0 ${(1 - pm) * 100}% 0 0)`;
  } else marc.textContent = '';
  C.CAP.forEach((c, i) => {
    const on = i === ci || (i === ci - 1 && t < C.CAP[ci].t + 0.35);
    c.el.style.display = on ? 'block' : 'none'; if (!on) return;
    const linhas = c.el.querySelectorAll('.linha span.in');
    linhas.forEach((sp, j) => {
      let y;
      if (i === ci) y = (1 - eOut(prog(t, c.t + j * 0.09, 0.55))) * 110;
      else y = -eInOut(prog(t, C.CAP[ci].t, 0.3)) * 110;
      sp.style.transform = `translateY(${y}%)`;
    });
  });
  // subtítulo
  let si = -1; subs.forEach((s, i) => { if (t >= s.t) si = i; });
  const fimFilme = C.S[C.S.length - 1].t;
  subs.forEach((s, i) => {
    const on = (i === si || (i === si - 1 && t < subs[si].t + 0.3)) && t < fimFilme;
    s.el.style.display = on ? 'block' : 'none'; if (!on) return;
    if (i === si) { const p = eOut(prog(t, s.t, 0.45)); s.el.style.transform = `translateY(${(1 - p) * 50}px)`; s.el.style.opacity = p; }
    else { const p = eOut(prog(t, subs[si].t, 0.3)); s.el.style.transform = `translateY(${-p * 40}px)`; s.el.style.opacity = 1 - p; }
  });
  // palco
  let k = -1; C.S.forEach((s, i) => { if (t >= s.t) k = i; });
  C.S.forEach((s) => { s.el.style.display = 'none'; });
  const TR = 0.5;
  const desenha = (s, papel, pt) => {
    if (!s || s.tipo === 'fim') return;
    s.el.style.display = 'block';
    // transição: troca de capítulo = cortina vertical; dentro do capítulo = empurrão lateral
    const capDe = (x) => { let c = -1; C.CAP.forEach((cc, i) => { if (x.t >= cc.t - 0.01) c = i; }); return c; };
    const novo = C.S[k];
    const capitulo = novo && C.S[k - 1] && capDe(novo) !== capDe(C.S[k - 1]);
    let tr = '', clip = 'none', op = 1;
    if (papel === 'entra') {
      const p = eOut(pt);
      if (capitulo || k === 0) { clip = `inset(${(1 - p) * 100}% 0 0 0 round 28px)`; tr = `translateY(${(1 - p) * 60}px)`; }
      else tr = `translateX(${(1 - p) * 1000}px)`;
    } else if (papel === 'sai') {
      const p = eOut(pt);
      if (capitulo) { tr = `translateY(${-p * 80}px) scale(${1 - p * 0.06})`; op = 1 - p; }
      else tr = `translateX(${-p * 1000}px)`;
    }
    s.el.style.transform = tr; s.el.style.clipPath = clip; s.el.style.opacity = op; s.el.style.zIndex = papel === 'entra' ? 2 : 1;
    // conteúdo
    const im = s.el.querySelector('img');
    let M = null;
    if (s.tipo === 'desk') { const q = transfDesk(s, t, im); im.style.width = q.iw + 'px'; im.style.height = q.ih + 'px'; im.style.transform = `translate(${q.tx}px,${q.ty}px)`; M = q.map; }
    if (s.tipo === 'cel') { const q = transfCel(s, t, im); im.style.width = CEL_W + 'px'; im.style.transform = `translate(0px,${q.ty}px)`; M = q.map; }
    if (s.tipo === 'html') {
      const w = s.el.querySelector('#whats'); const tEnv = C.W(4, 'envia');
      const n = Math.floor(clamp((t - s.t - 0.25) * 70, 0, MSG.length));
      w.querySelector('.msg').textContent = MSG.slice(0, n);
      const pr = prog(t, tEnv, 0.18), solta = prog(t, tEnv + 0.18, 0.25);
      const b = w.querySelector('.enviar'); b.style.transform = `scale(${1 - 0.07 * pr + 0.07 * solta})`;
      const feito = w.querySelector('.feito'); feito.textContent = t >= tEnv + 0.15 ? '✓ Enviado por você' : '';
      feito.style.opacity = eOut(prog(t, tEnv + 0.15, 0.4));
      const tq = s.el.querySelector('.toque'); const vis = prog(t, tEnv - 0.6, 0.3) * (1 - prog(t, tEnv + 0.9, 0.3));
      tq.style.left = (PW - 48 - 110) + 'px'; tq.style.top = (PH - 48 - 42) + 'px'; tq.style.opacity = vis;
      tq.querySelector('i').style.transform = `scale(${1 - 0.25 * pr + 0.25 * solta})`;
      tq.querySelector('u').style.transform = `scale(${1 + 0.8 * solta})`; tq.querySelector('u').style.opacity = 1 - solta;
    }
    if (M) {
      const aneis = s.el.querySelectorAll('.anel');
      (s.hl || []).forEach(([a, b, r], j) => {
        const el = aneis[j]; const vis = eOut(prog(t, a, 0.35)) * (1 - prog(t, b - 0.2, 0.2));
        const [x0, y0] = M(r[0], r[1]), [x1, y1] = M(r[0] + r[2], r[1] + r[3]);
        const ox = s.tipo === 'cel' ? 0 : 0;
        const pad = 8 + (1 - mola(prog(t, a, 0.6))) * 26;
